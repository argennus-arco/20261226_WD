<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1eb">
<meta property="og:type" content="website">
<meta property="og:title" content="저희 결혼합니다 | 2026. 12. 26.">
<meta property="og:description" content="시간을 건너 다시 마주한 두 사람의 시작에 귀한 걸음을 보태어 주세요.">
<meta property="og:image" content="https://raw.githubusercontent.com/argennus-arco/20261226_WD/main/bg.png">
<title>Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #4d404b;
  --paper: #f5f1eb;
  --white: #fffdf9;
  --line: #ded5d7;
  --muted: #92848d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
}

button, input, textarea { font: inherit; }

/* 페이지 단위 스크롤 */
#pages {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  overscroll-behavior-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#pages::-webkit-scrollbar { display: none; }

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  scroll-snap-align: start;
  flex-shrink: 0;
}

/* 1페이지: 청첩장 이미지 */
.cover {
  background: var(--paper);
}

.cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

.scroll-cue {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: var(--ink);
  font: 9px Arial, sans-serif;
  letter-spacing: .2em;
  pointer-events: none;
}

.scroll-cue::after {
  content: "";
  display: block;
  width: 1px;
  height: 20px;
  margin: 9px auto 0;
  background: #b9aab2;
}

/* 2페이지: 전체 화면 영상 */
.film {
  background: #000;
}

.film video {
  display: block;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

/* 3페이지: 정보 */
.details {
  background: var(--white);
  height: auto;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: visible;
  padding:
    max(38px, env(safe-area-inset-top))
    22px
    max(32px, env(safe-area-inset-bottom));
}

.details-inner {
  max-width: 520px;
  width: 100%;
  margin: 0 auto;
}

.details-header {
  text-align: center;
  padding: 12px 0 30px;
}

.eyebrow, .section-title {
  font: 10px Arial, sans-serif;
  letter-spacing: .25em;
  color: var(--muted);
  text-align: center;
}

.details-header h1 {
  margin: 16px 0;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: .08em;
}

.invitation-text {
  color: #786c75;
  font-size: 12px;
  line-height: 2.2;
}

.section-title { margin: 30px 0 18px; }

/* 사진 */
.photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.photo-grid img {
  display: block;
  width: 100%;
  height: 230px;
  object-fit: cover;
  background: #eee7e5;
}

/* 예식 정보 */
.event-card {
  padding: 24px 10px;
  text-align: center;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.event-date {
  font-size: 18px;
  line-height: 1.8;
}

.event-time {
  margin: 8px 0 20px;
  font-size: 13px;
}

.event-place {
  font-size: 15px;
  line-height: 1.9;
}

.event-address {
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

.action-row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.action {
  padding: 11px 15px;
  border: 1px solid #cfc3ca;
  color: var(--ink);
  background: transparent;
  text-decoration: none;
  font-size: 11px;
  cursor: pointer;
}

/* 계좌 */
.account-list {
  display: grid;
  gap: 8px;
}

.account {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 15px 12px;
  border: 1px solid #e4dcde;
  font-size: 12px;
}

.account small {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 10px;
}

.account code {
  font-family: Arial, sans-serif;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.copy-button {
  flex-shrink: 0;
  padding: 9px 10px;
  border: 0;
  background: #eee7e8;
  color: var(--ink);
  font-size: 10px;
  cursor: pointer;
}

/* 축하 인사 (iOS 자동 줌인 방지를 위해 16px 적용) */
.guestbook input,
.guestbook textarea {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 0;
  outline-color: #bbaab4;
  background: white;
  color: var(--ink);
  font-size: 16px;
}

.guestbook textarea {
  min-height: 90px;
  resize: vertical;
}

.submit-button {
  width: 100%;
  padding: 14px;
  border: 0;
  background: var(--ink);
  color: white;
  font-size: 12px;
  cursor: pointer;
}

. submit-button:disabled {
  opacity: 0.6;
  cursor: default;
}

.guestbook-note {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.8;
}

.message {
  padding: 12px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.message strong { margin-right: 8px; font-weight: 500; }

.closing {
  margin-top: 36px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  line-height: 2.2;
}

@media (min-width: 700px) {
  .details { padding-top: 55px; }
  .photo-grid img { height: 300px; }
}

@media (prefers-reduced-motion: reduce) {
  #pages { scroll-behavior: auto; }
}
</style>
</head>

<body>

<script>
const WEDDING = {
  // 1페이지 청첩장 이미지 주소
  coverImage:
    "https://raw.githubusercontent.com/argennus-arco/20261226_WD/main/bg.png",

  // 2페이지 세로 영상 주소 (9:16)
  video:
    "https://argennus-arco.github.io/20261226_WD/edit.mp4",

  // 3페이지 사진 주소
  photo1:
    "여기에_첫번째_사진의_Google_Drive_주소",

  photo2:
    "여기에_두번째_사진의_Google_Drive_주소",

  // 예식 정보
  date: "2026년 12월 26일 토요일",
  time: "오후 1시 00분",
  venue: "예식장 이름을 입력해 주세요",
  address: "예식장 도로명 주소를 입력해 주세요",
  mapUrl: "https://map.kakao.com/",

  // 계좌번호
  groomAccount: "은행명 000-000-000000",
  brideAccount: "은행명 000-000-000000",

  // 👇 여기에 복사한 Google Apps Script 웹 앱 URL을 넣어 줘!
  guestbookUrl: "https://script.google.com/macros/s/AKfycbzxlrQTjmKRsp_N3cxqq6OkWhi6rEtDQYkt2EUtoOpfbNZ_kYtx6ovf3EIijXhtSSii/exec"
};

function directUrl(url, type = "image") {
  if (!url || url.startsWith("여기에_")) return "";

  const match =
    url.match(/\/file\/d\/([^/]+)/) ||
    url.match(/\/d\/([^/]+)/) ||
    url.match(/[?&]id=([^&]+)/);

  if (match) {
    const id = match[1];
    if (type === "video") {
      return "https://drive.google.com/uc?export=download&id=" + id;
    }
    return "https://drive.google.com/uc?export=view&id=" + id;
  }

  return url;
}
</script>

<div id="pages">

  <!-- 1페이지 -->
  <section class="scene cover" id="page1">
    <img id="coverImage" alt="결혼식 초대장" style="display:none">
    <div class="scroll-cue">SCROLL TO BEGIN</div>
  </section>

  <!-- 2페이지 -->
  <section class="scene film" id="page2">
    <video
      id="weddingVideo"
      muted
      loop
      playsinline
      preload="metadata"
      style="display:none"
    ></video>
  </section>

  <!-- 3페이지 -->
  <section class="scene details" id="page3">
    <div class="details-inner">

      <header class="details-header">
        <div class="eyebrow">SAVE THE DATE</div>
        <h1>저희 결혼합니다</h1>

        <p class="invitation-text">
          시간을 건너 다시 마주한 두 사람이<br>
          서로의 계절을 존중하며<br>
          마침내 오롯이 함께하기 위해<br>
          내일을 약속합니다.<br><br>
          귀한 걸음을 보태어 축복해 주신다면<br>
          부족한 저희 두 사람의 앞날에<br>
          나날이 포개어<br>
          더없는 기쁨으로 새기며 살겠습니다.
        </p>
      </header>

      <div class="section-title">OUR MOMENTS</div>

      <div class="photo-grid">
        <img id="photo1" alt="웨딩 사진 1" style="display:none">
        <img id="photo2" alt="웨딩 사진 2" style="display:none">
      </div>

      <div class="section-title">WEDDING CEREMONY</div>

      <div class="event-card">
        <div class="event-date" id="eventDate"></div>
        <div class="event-time" id="eventTime"></div>
        <div class="event-place" id="eventVenue"></div>
        <div class="event-address" id="eventAddress"></div>

        <div class="action-row">
          <a class="action" id="mapLink" target="_blank" rel="noopener">카카오맵</a>
          <button class="action" id="copyAddress" type="button">
            주소 복사
          </button>
        </div>
      </div>

      <div class="section-title">WITH LOVE</div>

      <div class="account-list">
        <div class="account">
          <div>
            <small>신랑 측 · 계좌번호</small>
            <code id="groomAccount"></code>
          </div>
          <button class="copy-button" id="copyGroom" type="button">
            계좌 복사
          </button>
        </div>

        <div class="account">
          <div>
            <small>신부 측 · 계좌번호</small>
            <code id="brideAccount"></code>
          </div>
          <button class="copy-button" id="copyBride" type="button">
            계좌 복사
          </button>
        </div>
      </div>

      <div class="section-title">GUESTBOOK</div>

      <form class="guestbook" id="guestbookForm">
        <input id="guestName" maxlength="30" placeholder="이름" required>

        <textarea id="guestMessage" maxlength="300"
          placeholder="두 사람에게 축하의 마음을 남겨 주세요."
          required></textarea>

        <button class="submit-button" type="submit">
          축하 인사 남기기
        </button>

        <p class="guestbook-note">
          방명록을 불러오는 중입니다...
        </p>

        <div id="messageList" aria-live="polite"></div>
      </form>

      <div class="closing">
        함께해 주시는 마음을<br>
        오래도록 간직하겠습니다.
      </div>

    </div>
  </section>

</div>

<script>
/* 이미지 적용 */
function setImage(elementId, url) {
  if (!url) return;

  const img = document.getElementById(elementId);
  img.src = directUrl(url, "image");
  img.style.display = "block";

  img.onerror = function () {
    img.style.display = "none";
    console.warn("이미지를 불러오지 못했습니다:", url);
  };
}

setImage("coverImage", WEDDING.coverImage);
setImage("photo1", WEDDING.photo1);
setImage("photo2", WEDDING.photo2);

/* 동영상 로드 및 2페이지 진입 시 자동 재생 */
(function () {
  const url = directUrl(WEDDING.video, "video");
  if (!url) return;

  const video = document.getElementById("weddingVideo");
  const page2 = document.getElementById("page2");

  video.src = url;
  video.style.display = "block";
  video.load();

  if ("IntersectionObserver" in window && page2) {
    const observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            video.play().catch(function () {});
          } else {
            video.pause();
          }
        });
      },
      { threshold: 0.5 }
    );
    observer.observe(page2);
  } else {
    video.play().catch(function () {});
  }
})();

/* 예식 정보 표시 */
document.getElementById("eventDate").textContent = WEDDING.date;
document.getElementById("eventTime").textContent = WEDDING.time;
document.getElementById("eventVenue").textContent = WEDDING.venue;
document.getElementById("eventAddress").textContent = WEDDING.address;

document.getElementById("mapLink").href =
  WEDDING.mapUrl || "https://map.kakao.com/";

document.getElementById("groomAccount").textContent =
  WEDDING.groomAccount;
document.getElementById("brideAccount").textContent =
  WEDDING.brideAccount;

/* 복사 기능 */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert("복사했습니다.");
  } catch (error) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();

    const success = document.execCommand("copy");
    textarea.remove();

    alert(success ? "복사했습니다." : "복사에 실패했습니다.");
  }
}

document.getElementById("copyAddress").onclick = function () {
  copyText(WEDDING.address);
};

document.getElementById("copyGroom").onclick = function () {
  copyText(WEDDING.groomAccount);
};

document.getElementById("copyBride").onclick = function () {
  copyText(WEDDING.brideAccount);
};

/* 구글 드라이브(시트) 방명록 연동 */
(function () {
  const form = document.getElementById("guestbookForm");
  const list = document.getElementById("messageList");
  const note = document.querySelector(".guestbook-note");
  const submitBtn = form.querySelector(".submit-button");
  const apiUrl = WEDDING.guestbookUrl;

  function createMessageItem(name, message) {
    const item = document.createElement("div");
    item.className = "message";

    const strong = document.createElement("strong");
    strong.textContent = name;

    const span = document.createElement("span");
    span.textContent = message;

    item.append(strong, span);
    return item;
  }

  // 초기 방명록 목록 불러오기
  if (apiUrl && apiUrl.startsWith("https://script.google.com/")) {
    fetch(apiUrl)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (note) note.style.display = "none";
        list.innerHTML = "";
        data.forEach(function (entry) {
          list.appendChild(createMessageItem(entry.name, entry.message));
        });
      })
      .catch(function (err) {
        console.warn("방명록을 불러오지 못했습니다:", err);
        if (note) note.textContent = "방명록을 불러오지 못했습니다. 배포 권한 설정을 확인해 주세요.";
      });
  } else {
    if (note) note.textContent = "구글 스크립트 URL이 아직 연결되지 않았습니다.";
  }

  // 방명록 작성 및 전송
  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const name = document.getElementById("guestName").value.trim();
    const message = document.getElementById("guestMessage").value.trim();

    if (!name || !message) return;

    const newItem = createMessageItem(name, message);
    list.prepend(newItem);
    form.reset();

    if (apiUrl && apiUrl.startsWith("https://script.google.com/")) {
      submitBtn.disabled = true;
      submitBtn.textContent = "전송 중...";

      fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ name: name, message: message })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.status !== "success") {
            throw new Error(result.message || "서버 오류");
          }
        })
        .catch(function (err) {
          console.error("방명록 저장 실패:", err);
          alert("저장에 실패했습니다. 잠시 후 다시 시도해 주세요.");
          newItem.remove();
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "축하 인사 남기기";
        });
    }
  });
})();
</script>

</body>
</html>
