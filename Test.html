<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1eb">
<meta property="og:type" content="website">
<meta property="og:title" content="저희 결혼합니다 | 2026. 12. 26.">
<meta property="og:description" content="시간을 건너 다시 마주한 두 사람의 시작에 귀한 걸음을 보태어 주세요.">
<meta property="og:image" content="https://argennus-arco.github.io/20261226_WD/bg.png">
<title>Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #4d404b;
  --paper: #f5f1eb;
  --white: #fffdf9;
  --line: #ded5d7;
  --muted: #92848d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
}

button, input, textarea { font: inherit; }

/* 페이지 단위 스크롤 */
#pages {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  overscroll-behavior-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#pages::-webkit-scrollbar { display: none; }

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  scroll-snap-align: start;
  flex-shrink: 0;
}

/* 1페이지: 청첩장 이미지 */
.cover {
  background: var(--paper);
}

.cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

.scroll-cue {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: var(--ink);
  font: 9px Arial, sans-serif;
  letter-spacing: .2em;
  pointer-events: none;
}

.scroll-cue::after {
  content: "";
  display: block;
  width: 1px;
  height: 20px;
  margin: 9px auto 0;
  background: #b9aab2;
}

/* 2페이지: 전체 화면 영상 및 사운드 오버레이 */
.film {
  background: #000;
}

.film video {
  display: block;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.sound-toggle {
  position: absolute;
  right: 20px;
  bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: #fff;
  font: 10px Arial, sans-serif;
  letter-spacing: 0.12em;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.sound-toggle:hover,
.sound-toggle:active {
  background: rgba(0, 0, 0, 0.65);
  border-color: rgba(255, 255, 255, 0.6);
}

.sound-toggle svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 3페이지: 정보 */
.details {
  background: var(--white);
  height: auto;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: visible;
  padding:
    max(38px, env(safe-area-inset-top))
    22px
    max(32px, env(safe-area-inset-bottom));
}

.details-inner {
  max-width: 520px;
  width: 100%;
  margin: 0 auto;
}

.details-header {
  text-align: center;
  padding: 12px 0 30px;
}

.eyebrow, .section-title {
  font: 10px Arial, sans-serif;
  letter-spacing: .25em;
  color: var(--muted);
  text-align: center;
}

.details-header h1 {
  margin: 16px 0;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: .08em;
}

.invitation-text {
  color: #786c75;
  font-size: 12px;
  line-height: 2.2;
}

.section-title { margin: 30px 0 18px; }

/* 사진 그리드 (클릭 시 확대 가능) */
.photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.photo-grid img {
  display: block;
  width: 100%;
  height: 230px;
  object-fit: cover;
  background: #eee7e5;
  cursor: zoom-in;
  transition: opacity 0.2s;
}

.photo-grid img:active {
  opacity: 0.85;
}

/* 사진 확대 모달 (Lightbox) */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:
    max(56px, env(safe-area-inset-top))
    16px
    max(48px, env(safe-area-inset-bottom));
  background: rgba(18, 15, 17, 0.92);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  user-select: none;
}

.lightbox.is-open {
  opacity: 1;
  pointer-events: auto;
}

.lightbox img {
  display: block;
  max-width: 100%;
  max-height: 82dvh;
  object-fit: contain;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  transform: scale(0.97);
  transition: transform 0.25s ease;
}

.lightbox.is-open img {
  transform: scale(1);
}

.lightbox-counter {
  position: absolute;
  top: max(24px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.8);
  font: 11px Arial, sans-serif;
  letter-spacing: 0.2em;
}

.lightbox-close {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  width: 40px;
  height: 40px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.45);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.4);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
}

.lightbox-nav:hover,
.lightbox-nav:active {
  background: rgba(0, 0, 0, 0.7);
}

.lightbox-prev { left: 12px; }
.lightbox-next { right: 12px; }

/* 예식 정보 및 구글 지도 */
.event-card {
  padding: 24px 10px;
  text-align: center;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.event-date {
  font-size: 18px;
  line-height: 1.8;
}

.event-time {
  margin: 8px 0 20px;
  font-size: 13px;
}

.event-place {
  font-size: 15px;
  line-height: 1.9;
}

.event-address {
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

.map-wrap {
  margin: 18px 0 14px;
  border: 1px solid var(--line);
  background: var(--paper);
  overflow: hidden;
}

.google-map {
  display: block;
  width: 100%;
  height: 230px;
  border: 0;
}

.action-row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
}

.action {
  flex: 1 1 auto;
  min-width: 96px;
  padding: 10px 13px;
  border: 1px solid #cfc3ca;
  color: var(--ink);
  background: transparent;
  text-decoration: none;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
}

.action:hover,
.action:active {
  background: #eee7e8;
}

/* 계좌 */
.account-list {
  display: grid;
  gap: 8px;
}

.account {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 15px 12px;
  border: 1px solid #e4dcde;
  font-size: 12px;
}

.account small {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 10px;
}

.account code {
  font-family: Arial, sans-serif;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.copy-button {
  flex-shrink: 0;
  padding: 9px 10px;
  border: 0;
  background: #eee7e8;
  color: var(--ink);
  font-size: 10px;
  cursor: pointer;
}

/* 축하 인사 (iOS 자동 줌인 방지를 위해 16px 적용) */
.guestbook input,
.guestbook textarea {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 0;
  outline-color: #bbaab4;
  background: white;
  color: var(--ink);
  font-size: 16px;
}

.guestbook textarea {
  min-height: 90px;
  resize: vertical;
}

.submit-button {
  width: 100%;
  padding: 14px;
  border: 0;
  background: var(--ink);
  color: white;
  font-size: 12px;
  cursor: pointer;
}

.submit-button:disabled {
  opacity: 0.6;
  cursor: default;
}

.guestbook-note {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
  text-align: center;
}

.closing {
  margin-top: 36px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  line-height: 2.2;
}

@media (min-width: 700px) {
  .details { padding-top: 55px; }
  .photo-grid img { height: 300px; }
  .google-map { height: 270px; }
}

@media (prefers-reduced-motion: reduce) {
  #pages { scroll-behavior: auto; }
}
</style>
</head>

<body>

<script>
const WEDDING = {
  // 1페이지 청첩장 이미지 주소 (GitHub Pages CDN 경로 권장)
  coverImage:
    "https://argennus-arco.github.io/20261226_WD/bg.png",

  // 2페이지 세로 영상 주소 (9:16)
  video:
    "https://argennus-arco.github.io/20261226_WD/edit.mp4",

  // 3페이지 웨딩 사진 목록 (원하는 개수만큼 줄을 추가하거나 삭제하면 자동 반영됩니다)
  photos: [
    "https://argennus-arco.github.io/20261226_WD/photo1.jpg",
    "https://argennus-arco.github.io/20261226_WD/photo2.jpg",
    "https://argennus-arco.github.io/20261226_WD/photo3.jpg",
    "https://argennus-arco.github.io/20261226_WD/photo4.jpg",
    "https://argennus-arco.github.io/20261226_WD/photo5.jpg",
    "https://argennus-arco.github.io/20261226_WD/photo6.jpg"
  ],

  // 예식 기본 정보
  date: "2026년 12월 26일 토요일",
  time: "오후 1시",
  venue: "웨딩비엔나 컨벤션홀 4층",
  address: "대구 달서구 달구벌대로 1846",

  // [예식장 좌표] 구글 지도 표시 및 카카오/네이버 길찾기 연동용 위도(lat), 경도(lng)
  lat: 35.8602666,
  lng: 128.5668793,

  // 계좌번호
  groomAccount: "대구은행 508-13-998184-3",
  brideAccount: "하나은행 104-891264-84807",

  // 방명록 Google Apps Script 웹 앱 URL
  guestbookUrl: "https://script.google.com/macros/s/복사한_주소_전체/exec"
};

function directUrl(url, type = "image") {
  if (!url || url.startsWith("여기에_")) return "";

  const match =
    url.match(/\/file\/d\/([^/]+)/) ||
    url.match(/\/d\/([^/]+)/) ||
    url.match(/[?&]id=([^&]+)/);

  if (match) {
    const id = match[1];
    if (type === "video") {
      return "https://drive.google.com/uc?export=download&id=" + id;
    }
    return "https://drive.google.com/uc?export=view&id=" + id;
  }

  return url;
}
</script>

<div id="pages">

  <section class="scene cover" id="page1">

<!-- 사진 클릭 시 확대 모달 (좌우 넘기기 지원) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="lightbox-counter" id="lightboxCounter"></div>
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="닫기">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="이전 사진">&#8249;</button>
  <img id="lightboxImage" alt="확대된 웨딩 사진">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="다음 사진">&#8250;</button>
</div>

<script>
/* 1페이지 커버 이미지 적용 */
(function () {
  const coverUrl = directUrl(WEDDING.coverImage, "image");
  if (!coverUrl) return;

  const coverImg = document.getElementById("coverImage");
  coverImg.src = coverUrl;
  coverImg.style.display = "block";
  coverImg.onerror = function () {
    coverImg.style.display = "none";
  };
})();

/* 3페이지 갤러리 동적 생성 및 클릭 확대(Lightbox) 연동 */
(function () {
  const photoGrid = document.getElementById("photoGrid");
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightboxImage");
  const lightboxCounter = document.getElementById("lightboxCounter");
  const lightboxClose = document.getElementById("lightboxClose");
  const lightboxPrev = document.getElementById("lightboxPrev");
  const lightboxNext = document.getElementById("lightboxNext");

  // 유효한 사진 주소만 필터링
  const validPhotos = (WEDDING.photos || [])
    .map(function (url) { return directUrl(url, "image"); })
    .filter(Boolean);

  let currentIndex = 0;

  function updateLightboxView() {
    if (!validPhotos.length) return;
    lightboxImage.src = validPhotos[currentIndex];
    lightboxImage.alt = "웨딩 사진 " + (currentIndex + 1);
    lightboxCounter.textContent = (currentIndex + 1) + " / " + validPhotos.length;

    const showNav = validPhotos.length > 1 ? "flex" : "none";
    lightboxPrev.style.display = showNav;
    lightboxNext.style.display = showNav;
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightboxView();
    lightbox.classList.add("is-open");
  }

  function closeLightbox() {
    lightbox.classList.remove("is-open");
    setTimeout(function () {
      if (!lightbox.classList.contains("is-open")) {
        lightboxImage.removeAttribute("src");
      }
    }, 250);
  }

  function showPrev() {
    if (!validPhotos.length) return;
    currentIndex = (currentIndex - 1 + validPhotos.length) % validPhotos.length;
    updateLightboxView();
  }

  function showNext() {
    if (!validPhotos.length) return;
    currentIndex = (currentIndex + 1) % validPhotos.length;
    updateLightboxView();
  }

  // 사진 그리드 렌더링
  validPhotos.forEach(function (src, index) {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "웨딩 사진 " + (index + 1);
    img.loading = "lazy";
    img.decoding = "async";

    img.addEventListener("click", function () {
      openLightbox(index);
    });

    img.onerror = function () {
      img.style.display = "none";
      console.warn("이미지를 불러오지 못했습니다:", src);
    };

    photoGrid.appendChild(img);
  });

  // 모달 버튼 이벤트
  lightboxClose.addEventListener("click", closeLightbox);
  lightboxPrev.addEventListener("click", function (e) {
    e.stopPropagation();
    showPrev();
  });
  lightboxNext.addEventListener("click", function (e) {
    e.stopPropagation();
    showNext();
  });

  lightbox.addEventListener("click", function (event) {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });

  // 키보드 방향키 및 ESC 지원
  document.addEventListener("keydown", function (event) {
    if (!lightbox.classList.contains("is-open")) return;
    if (event.key === "Escape") closeLightbox();
    if (event.key === "ArrowLeft") showPrev();
    if (event.key === "ArrowRight") showNext();
  });

  // 모바일 터치 좌우 스와이프 지원
  let touchStartX = 0;
  lightbox.addEventListener("touchstart", function (event) {
    touchStartX = event.changedTouches[0].screenX;
  }, { passive: true });

  lightbox.addEventListener("touchend", function (event) {
    const touchEndX = event.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) > 40) {
      if (diff > 0) {
        showPrev();
      } else {
        showNext();
      }
    }
  }, { passive: true });
})();

/* 동영상 로드, 자동 재생 및 사운드 오버레이 제어 */
(function () {
  const url = directUrl(WEDDING.video, "video");
  if (!url) return;

  const video = document.getElementById("weddingVideo");
  const page2 = document.getElementById("page2");
  const soundToggle = document.getElementById("soundToggle");
  const soundIcon = document.getElementById("soundIcon");
  const soundLabel = document.getElementById("soundLabel");

  const iconMuted =
    '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
  const iconUnmuted =
    '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';

  function updateSoundUI() {
    if (video.muted) {
      soundIcon.innerHTML = iconMuted;
      soundLabel.textContent = "SOUND OFF";
      soundToggle.setAttribute("aria-label", "소리 켜기");
    } else {
      soundIcon.innerHTML = iconUnmuted;
      soundLabel.textContent = "SOUND ON";
      soundToggle.setAttribute("aria-label", "소리 끄기");
    }
  }

  video.src = url;
  video.style.display = "block";
  soundToggle.style.display = "inline-flex";
  updateSoundUI();
  video.load();

  soundToggle.addEventListener("click", function () {
    video.muted = !video.muted;
    if (video.paused) {
      video.play().catch(function () {});
    }
    updateSoundUI();
  });

  if ("IntersectionObserver" in window && page2) {
    const observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            video.play().catch(function () {});
          } else {
            video.pause();
          }
        });
      },
      { threshold: 0.5 }
    );
    observer.observe(page2);
  } else {
    video.play().catch(function () {});
  }
})();

/* 복사 기능 */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert("복사했습니다.");
  } catch (error) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();

    const success = document.execCommand("copy");
    textarea.remove();

    alert(success ? "복사했습니다." : "복사에 실패했습니다.");
  }
}

document.getElementById("copyAddress").onclick = function () {
  copyText(WEDDING.address);
};

document.getElementById("copyGroom").onclick = function () {
  copyText(WEDDING.groomAccount);
};

document.getElementById("copyBride").onclick = function () {
  copyText(WEDDING.brideAccount);
};

/* 구글 지도 표시 & 카카오맵·네이버지도 연동 */
(function () {
  const destLat = Number(WEDDING.lat);
  const destLng = Number(WEDDING.lng);
  const hasCoords = !isNaN(destLat) && !isNaN(destLng) && destLat !== 0 && destLng !== 0;
  const venueName = WEDDING.venue || "예식장";

  // 1. 구글 지도 임베드 설정 (좌표 우선, 없을 경우 주소 기준)
  const mapEl = document.getElementById("googleMap");
  if (mapEl) {
    const mapQuery = hasCoords
      ? destLat + "," + destLng
      : (WEDDING.address || venueName);

    mapEl.src =
      "https://maps.google.com/maps?q=" +
      encodeURIComponent(mapQuery) +
      "&hl=ko&z=16&output=embed";
  }

  // 2. 카카오맵 길찾기
  document.getElementById("kakaoRouteBtn").onclick = function () {
    const url = hasCoords
      ? "https://map.kakao.com/link/to/" +
        encodeURIComponent(venueName) + "," + destLat + "," + destLng
      : "https://map.kakao.com/link/search/" +
        encodeURIComponent(WEDDING.address || venueName);

    window.open(url, "_blank", "noopener");
  };

  // 3. 네이버지도 길찾기
  document.getElementById("naverRouteBtn").onclick = function () {
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const encodedVenue = encodeURIComponent(venueName);

    if (isMobile && hasCoords) {
      const appUrl =
        "nmap://route/public?dlat=" + destLat +
        "&dlng=" + destLng +
        "&dname=" + encodedVenue +
        "&appname=" + encodeURIComponent(window.location.origin);

      const webFallbackUrl =
        "https://m.map.naver.com/route.nhn?menu=route&ename=" +
        encodedVenue + "&ex=" + destLng + "&ey=" + destLat +
        "&pathType=1&showMap=true";

      const clickedAt = Date.now();
      window.location.href = appUrl;

      setTimeout(function () {
        if (Date.now() - clickedAt < 1600) {
          window.open(webFallbackUrl, "_blank", "noopener");
        }
      }, 1200);
    } else {
      const pcUrl =
        "https://map.naver.com/p/search/" +
        encodeURIComponent(WEDDING.address || venueName);
      window.open(pcUrl, "_blank", "noopener");
    }
  };
})();

/* 구글 드라이브(시트) 방명록 저장 전용 (페이지 미표시) */
(function () {
  const form = document.getElementById("guestbookForm");
  const note = document.getElementById("guestbookNote");
  const submitBtn = form.querySelector(".submit-button");
  const apiUrl = WEDDING.guestbookUrl;

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const name = document.getElementById("guestName").value.trim();
    const message = document.getElementById("guestMessage").value.trim();

    if (!name || !message) return;

    if (!apiUrl || !apiUrl.startsWith("https://script.google.com/")) {
      alert("구글 스크립트 URL이 아직 연결되지 않았습니다.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "전송 중...";

    fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name: name, message: message })
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        if (result.status !== "success") {
          throw new Error(result.message || "서버 오류");
        }
        form.reset();
        if (note) {
          note.textContent = "소중한 축하 인사가 전달되었습니다. 감사합니다.";
        }
        alert("축하 인사가 전달되었습니다. 감사합니다.");
      })
      .catch(function (err) {
        console.error("방명록 저장 실패:", err);
        alert("저장에 실패했습니다. 잠시 후 다시 시도해 주세요.");
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "축하 인사 남기기";
      });
  });
})();
</script>
